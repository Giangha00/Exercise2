<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tạo phiếu mượn')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container pb-5 col-lg-9">
    <h1 class="h3">Tạo phiếu mượn</h1>
    <p class="text-muted">Ngày mượn là hôm nay. Một phiếu cần ít nhất một đầu sách, không trùng sách, và số lượng không vượt tồn kho. Nếu một dòng lỗi, cả phiếu được hoàn tác.</p>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <form class="card p-4" th:action="@{/borrowings}" th:object="${form}" method="post" id="borrow-form">
        <div class="row g-3 mb-3">
            <div class="col-md-7">
                <label class="form-label">Độc giả</label>
                <select class="form-select" th:field="*{memberId}">
                    <option value="">-- Chọn độc giả --</option>
                    <option th:each="member : ${members}" th:value="${member.id}"
                            th:text="|${member.memberCode} — ${member.fullName}|"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
            </div>
            <div class="col-md-5">
                <label class="form-label">Hạn trả</label>
                <input class="form-control" type="date" th:field="*{dueDate}">
                <div class="text-danger small" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0">Sách mượn</h2>
            <button class="btn btn-outline-secondary btn-sm" type="button" id="add-line">Thêm đầu sách</button>
        </div>
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('lines')}" th:errors="*{lines}"></div>
        <div id="lines">
            <div class="row g-2 mb-2 borrow-line" th:each="line, stat : *{lines}">
                <div class="col-md-7">
                    <select class="form-select" th:field="*{lines[__${stat.index}__].bookId}">
                        <option value="">-- Chọn sách --</option>
                        <option th:each="book : ${books}" th:value="${book.id}"
                                th:text="|${book.title} — còn ${book.availableQuantity}|"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('lines[__${stat.index}__].bookId')}"
                         th:errors="*{lines[__${stat.index}__].bookId}"></div>
                </div>
                <div class="col-md-3">
                    <input class="form-control" type="number" min="1" th:field="*{lines[__${stat.index}__].quantity}" placeholder="Số lượng">
                    <div class="text-danger small" th:if="${#fields.hasErrors('lines[__${stat.index}__].quantity')}"
                         th:errors="*{lines[__${stat.index}__].quantity}"></div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-danger w-100 remove-line" type="button">Xóa</button>
                </div>
            </div>
        </div>
        <button class="btn btn-pine mt-3" type="submit">Tạo phiếu</button>
        <a class="btn btn-link" th:href="@{/borrowings}">Hủy</a>
    </form>
    <template id="line-template">
        <div class="row g-2 mb-2 borrow-line">
            <div class="col-md-7">
                <select class="form-select" data-name="bookId">
                    <option value="">-- Chọn sách --</option>
                    <option th:each="book : ${books}" th:value="${book.id}"
                            th:text="|${book.title} — còn ${book.availableQuantity}|"></option>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="number" min="1" value="1" data-name="quantity">
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-danger w-100 remove-line" type="button">Xóa</button>
            </div>
        </div>
    </template>
</main>
<script>
    const lines = document.getElementById('lines');
    const template = document.getElementById('line-template');

    function reindex() {
        lines.querySelectorAll('.borrow-line').forEach((row, index) => {
            const book = row.querySelector('[data-name="bookId"], select');
            const qty = row.querySelector('[data-name="quantity"], input');
            book.name = `lines[${index}].bookId`;
            qty.name = `lines[${index}].quantity`;
        });
    }

    document.getElementById('add-line').addEventListener('click', () => {
        lines.appendChild(template.content.cloneNode(true));
        reindex();
    });

    lines.addEventListener('click', (event) => {
        if (!event.target.classList.contains('remove-line')) {
            return;
        }
        if (lines.querySelectorAll('.borrow-line').length === 1) {
            return;
        }
        event.target.closest('.borrow-line').remove();
        reindex();
    });
</script>
</body>
</html>
