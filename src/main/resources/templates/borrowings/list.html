<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phiếu mượn')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Phiếu mượn</h1>
        <a class="btn btn-pine" th:href="@{/borrowings/new}">Tạo phiếu</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <form class="card p-3 mb-3" method="get" th:action="@{/borrowings}">
        <div class="row g-2">
            <div class="col-md-3">
                <select class="form-select" name="status">
                    <option value="">Mọi trạng thái</option>
                    <option th:each="item : ${statuses}" th:value="${item}" th:text="${item.label}"
                            th:selected="${status != null and status == item}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" name="memberId">
                    <option value="">Mọi độc giả</option>
                    <option th:each="member : ${members}" th:value="${member.id}"
                            th:text="|${member.memberCode} — ${member.fullName}|"
                            th:selected="${memberId != null and memberId == member.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <input class="form-control" type="date" name="fromDate" th:value="${fromDate}">
            </div>
            <div class="col-md-2">
                <input class="form-control" type="date" name="toDate" th:value="${toDate}">
            </div>
            <div class="col-md-2 d-flex align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="overdueOnly" value="true" id="overdueOnly"
                           th:checked="${overdueOnly}">
                    <label class="form-check-label" for="overdueOnly">Chỉ quá hạn</label>
                </div>
            </div>
            <div class="col-12">
                <button class="btn btn-pine" type="submit">Lọc</button>
            </div>
        </div>
    </form>
    <div class="table-wrap p-3">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Độc giả</th>
                <th>Mượn</th>
                <th>Hạn trả</th>
                <th>Trạng thái</th>
                <th class="text-end">Còn phải thu</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${page.totalElements == 0}"><td colspan="6" class="text-muted">Không có phiếu phù hợp.</td></tr>
            <tr th:each="borrowing : ${page.content}">
                <td><a th:href="@{/borrowings/{id}(id=${borrowing.id})}" th:text="${borrowing.id}">1</a></td>
                <td>
                    <div th:text="${borrowing.member.fullName}">Tên</div>
                    <div class="text-muted small" th:text="${borrowing.member.memberCode}">Mã</div>
                </td>
                <td th:text="${#temporals.format(borrowing.borrowedDate, 'dd/MM/yyyy')}">ngày</td>
                <td th:text="${#temporals.format(borrowing.dueDate, 'dd/MM/yyyy')}">hạn</td>
                <td><span class="badge" th:classappend="|text-bg-${borrowing.status.badge}|" th:text="${borrowing.status.label}">TT</span></td>
                <td class="text-end" th:text="${@moneyFormat.vnd(borrowing.unpaidFineAmount)}">0</td>
            </tr>
            </tbody>
        </table>
        <nav class="mt-3" th:if="${page.totalPages > 1}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/borrowings(status=${status}, memberId=${memberId}, fromDate=${fromDate}, toDate=${toDate}, overdueOnly=${overdueOnly}, page=${page.number - 1})}">Trước</a>
                </li>
                <li class="page-item disabled"><span class="page-link" th:text="|${page.number + 1} / ${page.totalPages}|"></span></li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/borrowings(status=${status}, memberId=${memberId}, fromDate=${fromDate}, toDate=${toDate}, overdueOnly=${overdueOnly}, page=${page.number + 1})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</main>
</body>
</html>
