<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sách')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Danh sách sách</h1>
        <a class="btn btn-pine" th:href="@{/books/new}">Thêm sách</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <form class="card p-3 mb-3" method="get" th:action="@{/books}">
        <div class="row g-2">
            <div class="col-md-5">
                <input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Tên sách, tác giả hoặc ISBN">
            </div>
            <div class="col-md-4">
                <select class="form-select" name="categoryId">
                    <option value="">Mọi thể loại</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                            th:selected="${categoryId != null and categoryId == category.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-pine w-100" type="submit">Tìm</button>
            </div>
        </div>
    </form>
    <div class="table-wrap p-3">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Sách</th>
                <th>ISBN</th>
                <th>Thể loại</th>
                <th class="text-end">Còn mượn được</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${page.totalElements == 0}">
                <td colspan="4" class="text-muted">Chưa có sách phù hợp.</td>
            </tr>
            <tr th:each="book : ${page.content}">
                <td>
                    <div class="fw-semibold" th:text="${book.title}">Tên</div>
                    <div class="text-muted small" th:text="${book.author}">Tác giả</div>
                </td>
                <td th:text="${book.isbn}">ISBN</td>
                <td th:text="${book.category != null ? book.category.name : '—'}">Thể loại</td>
                <td class="text-end fw-semibold" th:text="${book.availableQuantity}">0</td>
            </tr>
            </tbody>
        </table>
        <nav class="mt-3" th:if="${page.totalPages > 1}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(keyword=${keyword}, categoryId=${categoryId}, page=${page.number - 1})}">Trước</a>
                </li>
                <li class="page-item disabled"><span class="page-link" th:text="|${page.number + 1} / ${page.totalPages}|"></span></li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(keyword=${keyword}, categoryId=${categoryId}, page=${page.number + 1})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</main>
</body>
</html>
