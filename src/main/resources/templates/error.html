<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lỗi')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container pb-5">
    <div class="card p-4">
        <h1 class="h3">Không thực hiện được thao tác</h1>
        <p th:if="${error}" th:text="${error}">Đã có lỗi.</p>
        <p th:unless="${error}">Dữ liệu không hợp lệ hoặc phiếu không còn tồn tại. Thao tác đã được hoàn tác nếu nó nằm trong transaction.</p>
        <a class="btn btn-pine" th:href="@{/}">Về trang chủ</a>
    </div>
</main>
</body>
</html>
