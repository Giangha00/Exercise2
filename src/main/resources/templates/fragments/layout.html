<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Thư viện'">Thư viện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Thư viện</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Sách</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/members}">Độc giả</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/borrowings}">Phiếu mượn</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/fine-policies}">Phí phạt</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reports/overdue}">Quá hạn</a></li>
            </ul>
            <a class="btn btn-sm btn-light" th:href="@{/borrowings/new}">Tạo phiếu mượn</a>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>
</body>
</html>
