spring.application.name=Exercise2

# MySQL trên XAMPP. Dùng 127.0.0.1 để tránh socket /tmp/mysql.sock của macOS.
# XAMPP mặc định: user root, mật khẩu trống, cổng 3306.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/library_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema do Flyway tạo. Hibernate chỉ kiểm tra entity khớp bảng, không tự sửa schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
